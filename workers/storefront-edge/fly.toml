# The storefront edge on Fly.io (decisions/0139 §3). Deploy: fly launch --copy-config --name trvgo-edge, then fly deploy.
app = "trvgo-edge"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/__edge"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
