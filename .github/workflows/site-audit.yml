# The site audit (decisions/0145, Phase 1): the code checks on the live mirror, the delivery log, the decision register
# and the page tree. Runs at :17 each hour when the mirror has a new sync, every Monday in full, and on Run workflow.
# Needs one secret, MIRROR_READ_TOKEN: a fine-grained token with read-only Contents on degraffics/traverse-3way-sync
# (site-audit/punch-list.md item 13). Commits only generated files: site-audit/scorecard.md, page-tree.md,
# results/, decisions/index.md, deliveries/.
name: Site audit

on:
  repository_dispatch:
    types: [site-audit]    # the site's clock asks at 7:17 and 19:17 UTC (AuditClock, decisions/0145): GitHub's schedule skips runs when it's busy
  schedule:
    - cron: '47 8,20 * * *'   # the fallback, if the site didn't ask   # twice a day, an hour after the scheduled syncs (Jason, 2026-11-11: "12 hour audit is fine"; was hourly)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Already run in this window? (the site's clock asks first; GitHub's schedule is the fallback)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-10 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/site-audit.yml/runs?created=%3E%3D$since&per_page=20" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "Run $n time(s) in the last 10 hours already: nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Is the mirror token set?
        if: env.SKIP != '1'
        env:
          T: ${{ secrets.MIRROR_READ_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::MIRROR_READ_TOKEN isn't set yet (site-audit/punch-list.md item 13). Nothing to check."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Read the live mirror
        if: env.SKIP != '1'
        uses: actions/checkout@v4
        with:
          repository: degraffics/traverse-3way-sync
          token: ${{ secrets.MIRROR_READ_TOKEN }}
          path: mirror
          fetch-depth: 1
          sparse-checkout: |
            sync-storage
            sync-app
            sync-trvgo

      - name: Anything new since the last run?
        if: env.SKIP != '1'
        run: |
          sha=$(git -C mirror rev-parse --short HEAD)
          last=$(cat site-audit/results/mirror-sha.txt 2>/dev/null || true)
          weekly=$([ "$(date -u +%u%H)" = "101" ] && echo 1 || echo 0)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$sha" = "$last" ] && [ "$weekly" = "0" ]; then
            echo "Mirror unchanged ($sha): nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            mkdir -p site-audit/results && echo "$sha" > site-audit/results/mirror-sha.txt
          fi

      - name: Code checks, register and page tree
        if: env.SKIP != '1'
        run: python3 tools/page-audit/audit.py --mirror mirror --write

      - name: Deliveries reached live?
        if: env.SKIP != '1'
        run: |
          if ls deliveries/*.json >/dev/null 2>&1; then python3 tools/page-audit/deliveries.py verify --mirror mirror --keep-claims; fi

      - name: Drift (live files changed without a release) and the findings for Site health
        if: env.SKIP != '1'
        run: |
          python3 tools/page-audit/drift.py --mirror mirror --write
          python3 tools/page-audit/findings.py

      - name: Commit what changed
        if: env.SKIP != '1'
        run: |
          git config user.name "site-audit"
          git config user.email "site-audit@users.noreply.github.com"
          git add site-audit/scorecard.md site-audit/page-tree.md site-audit/results decisions/index.md
          [ -d deliveries ] && git add deliveries
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Site audit: mirror $(cat site-audit/results/mirror-sha.txt)"
          git pull --rebase -X theirs -q   # the run's own generated files win a collision
          git push

      - name: Check-in (decisions/0161) - release the claims of releases now live, report lapsed ones
        if: env.SKIP != '1'
        run: |
          # its own commit on main's newest copy (never rebased over a claim made meanwhile)
          python3 tools/page-audit/checkout.py release-live
