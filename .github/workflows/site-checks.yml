# The rendered checks (decisions/0145, Phase 2): each page in a real browser at phone and desktop size, signed out and
# as the test accounts, held to the build standards (tools/page-audit/rendered.mjs). Daily at 09:43 UTC (a short run:
# signed out, a member, the business owner, every staff login's home, the executive everywhere), in full on Mondays
# and on Run workflow with "full". Only reads the site; changes nothing.
# Then the paths (decisions/0145 Phase 4, tools/page-audit/paths.mjs): the core paths that only read, as the test
# accounts, and a few guide paths a day in turn (GUIDES_PER_RUN), inside a time budget (PATHS_BUDGET_S), so the job
# stays short; then the findings for the Pulse "Site health" case (findings.py) and the page map (page-map.py).
# Run workflow with "paths only" walks just the paths (a few minutes). No push triggers: GitHub Actions minutes count.
# Secrets: MIRROR_READ_TOKEN (the page list from the mirror) and CHECK_ACCOUNTS (the block System Configuration → Test
# accounts shows once). Without CHECK_ACCOUNTS it checks signed out only. Commits site-audit/rendered.md, paths.md,
# page-map.md and their results/*.json; the screenshots stay with the run (Actions → the run → Artifacts), never in git.
name: Site checks (browser)

on:
  repository_dispatch:
    types: [site-checks]   # the site's clock asks at 9:17 UTC (AuditClock, decisions/0145): GitHub's schedule skips runs when it's busy
  schedule:
    - cron: '43 11 * * *'  # the fallback, if the site didn't ask
  workflow_dispatch:
    inputs:
      full:
        description: 'Every account on every page (slower)'
        type: boolean
        default: false
      paths_only:
        description: 'Only the paths (skip the page checks)'
        type: boolean
        default: false
      staging_paths:
        description: 'Also the staging paths that change something (they run Mondays and Thursdays on their own)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: site-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Already run in this window? (the site's clock asks first; GitHub's schedule is the fallback)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-20 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/site-checks.yml/runs?created=%3E%3D$since&per_page=20" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then echo "Run $n time(s) in the last 20 hours already: nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - name: Read the live mirror (the admin's sections)
        if: env.SKIP != '1'
        uses: actions/checkout@v4
        continue-on-error: true   # without MIRROR_READ_TOKEN, only the admin's home page is checked
        with:
          repository: degraffics/traverse-3way-sync
          token: ${{ secrets.MIRROR_READ_TOKEN }}
          path: mirror
          fetch-depth: 1
          sparse-checkout: |
            sync-app/admin

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: '20'

      - name: Playwright and Chromium
        if: env.SKIP != '1'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Check the pages
        if: ${{ env.SKIP != '1' && !inputs.paths_only }}
        env:
          SITE: https://traversence.com
          CHECK_ACCOUNTS: ${{ secrets.CHECK_ACCOUNTS }}
          MANIFESTS: mirror/sync-app/admin/manifests.php
          PAGE_TREE: site-audit/page-tree.md
          FULL: ${{ inputs.full && '1' || '0' }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then export FULL=1; fi
          if [ -z "$CHECK_ACCOUNTS" ]; then echo "::warning::CHECK_ACCOUNTS isn't set yet (System Configuration → Test accounts): signed-out checks only."; fi
          node tools/page-audit/rendered.mjs

      - name: Walk the paths
        if: env.SKIP != '1'
        continue-on-error: true   # the page checks' results are committed even if a path run fails
        env:
          SITE: https://traversence.com
          CHECK_ACCOUNTS: ${{ secrets.CHECK_ACCOUNTS }}
          FULL: ${{ inputs.full && '1' || '0' }}
          GUIDES_PER_RUN: '4'
          PATHS_BUDGET_S: '420'
          STAGING_PATHS: ${{ inputs.staging_paths && '1' || '0' }}
        run: |
          # the staging paths (Mondays, Thursdays, or asked for) need more time
          if [ "$STAGING_PATHS" = "1" ] || [ "$(date -u +%u)" = "1" ] || [ "$(date -u +%u)" = "4" ]; then export PATHS_BUDGET_S=1100; fi
          node tools/page-audit/paths.mjs

      - name: Findings (for Site health) and the page map
        if: env.SKIP != '1'
        run: |
          python3 tools/page-audit/findings.py --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 tools/page-audit/page-map.py

      - name: Keep the screenshots with the run
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit the results
        if: env.SKIP != '1'
        run: |
          git config user.name "site-checks"
          git config user.email "site-checks@users.noreply.github.com"
          git add site-audit/rendered.md site-audit/results/rendered.json site-audit/page-map.md site-audit/results/page-map.json site-audit/results/findings.json
          git add site-audit/paths.md site-audit/results/paths.json site-audit/results/paths-history.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Site checks: rendered pages and paths"
          git pull --rebase -q || true
          git push
