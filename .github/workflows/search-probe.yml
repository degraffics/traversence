# The search probe (Jason, 2026-11-10): runs a set of real searches against the live search API, signed out, and records
# what each was read as (place, words, guide offered, first results): tools/page-audit/search-probe.mjs. On Run
# workflow and daily at 10:17 UTC. Only reads the site. Commits site-audit/search-probe.md and its JSON.
name: Search probe

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe the searches
        env:
          SITE: https://traversence.com
        run: node tools/page-audit/search-probe.mjs
      - name: Commit the results
        run: |
          git config user.name "search-probe"
          git config user.email "search-probe@users.noreply.github.com"
          git add site-audit/search-probe.md site-audit/results/search-probe.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Search probe: what the live search reads"
          git pull --rebase -q || true
          git push
