# Live read for building (Jason, 2026-11-23: "this is why we have those accounts, we use them for building and audits").
# Run by hand only (a build session starts it): signs in as the test Executive from CHECK_ACCOUNTS through the page checks'
# kit (tools/page-audit/check-kit.mjs), opens only the named admin pages, presses nothing, and keeps what they show as
# this run's artifact for one day. Nothing is committed; nothing on the site changes (tools/page-audit/live-read.mjs).
name: Live read (build)

on:
  workflow_dispatch:
    inputs:
      read:
        description: 'What to read'
        type: choice
        options: [orders, order, ir0001, w0, board, dashboard, sent, jobs, rows, meta, register, workflows, card]
        default: orders
      order_id:
        description: "The order's number (for: order), the crawler run's (for: ir0001, default 1290), the search (for: rows), or a service's name (for: card)"
        type: string
        default: ''
      table:
        description: "A table's name (for: meta, its columns and types; for: rows, its newest matching rows; operational tables only)"
        type: string
        default: ''
      to_log:
        description: "Also print the pages' text in this run's log (deleted by the session once read)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/page-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Read the pages (read-only)
        env:
          SITE: https://traversence.com
          CHECK_ACCOUNTS: ${{ secrets.CHECK_ACCOUNTS }}
          READ: ${{ inputs.read }}
          ORDER_ID: ${{ inputs.order_id }}
          TABLE: ${{ inputs.table }}
          OUT: live-read
          TO_LOG: ${{ inputs.to_log && '1' || '0' }}
        run: node tools/page-audit/live-read.mjs
      - name: Keep it with the run for one day (never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-read
          path: live-read/
          retention-days: 1
          if-no-files-found: ignore
